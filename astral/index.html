    <title>Astral Flowers</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />

  <body>
    <main aria-label="A clustered bouquet on ivory">
      <canvas id="herbarium" role="img" aria-describedby="art-description"></canvas>
      <p id="art-description" class="sr-only">
        Fine stems gather into clusters of translucent flowers on warm ivory.
        A coral centre opens among lilac, cream, and blue-violet companions,
