<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#091228" />
    <meta name="color-scheme" content="dark" />
    <title>Astral Flowers</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main aria-label="Astral Flowers, an interactive botanical night study">
      <canvas id="garden" aria-hidden="true"></canvas>
      <button id="tide" class="sr-only" type="button" aria-label="Replay the flower opening">Replay the flower opening</button>
      <p class="sr-only">A canvas artwork. Move a pointer to bend the stems. Press space or enter to replay the flower opening.</p>
    </main>
    <script src="garden.js"></script>
  </body>
</html>
